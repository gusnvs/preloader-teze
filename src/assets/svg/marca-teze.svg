<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 124" role="img" aria-label="Marca Teze">
  <defs>
    <pattern id="mt-vichy" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#F7F1E4"/>
      <rect width="4.5" height="9" fill="#A8202A" opacity=".62"/>
      <rect width="9" height="4.5" fill="#A8202A" opacity=".62"/>
    </pattern>

    <!-- Silhueta da pata, de perfil, virada para a esquerda.
         Uma forma cheia le melhor em tamanho pequeno do que um contorno —
         e o xadrez preenchendo o corpo e o que identifica a marca. -->
    <path id="mt-pata"
          d="M20 34 C20 26 26 20 35 20 C42 20 47 25 48 32 C49 39 46 44 43 48
             C41 53 41 57 44 60 C56 58 70 62 78 70 C87 79 84 92 70 96
             C55 100 36 96 28 85 C21 75 21 65 28 57 C32 52 34 47 33 43
             C26 43 22 39 20 34 Z"/>
    <path id="mt-bico"
          d="M22 30 C13 27 5 29 3 33 C5 38 13 39 22 36 Z"/>
    <clipPath id="mt-corpo"><use href="#mt-pata"/></clipPath>
  </defs>

  <!-- Assinatura -->
  <text x="8" y="82" font-family="'Bodoni Moda', Didot, Georgia, serif" font-size="62"
        font-style="italic" fill="#A8202A">Tezê</text>

  <!-- Selo circular a direita -->
  <g transform="translate(140 4) scale(0.86)">
    <circle cx="52" cy="58" r="55" fill="none" stroke="#A8202A" stroke-width="2.6"/>

    <g clip-path="url(#mt-corpo)">
      <rect x="0" y="0" width="110" height="110" fill="url(#mt-vichy)"/>
    </g>
    <use href="#mt-pata" fill="none" stroke="#A8202A" stroke-width="2.6" stroke-linejoin="round"/>
    <use href="#mt-bico" fill="#E3B33F" stroke="#A8202A" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Chapeu de palha -->
    <ellipse cx="36" cy="20" rx="24" ry="5.5" fill="#E3B33F" stroke="#A8202A" stroke-width="2"/>
    <path d="M23 20 C24 12 30 8 37 8 C44 8 49 13 49 20 Z" fill="#E3B33F"
          stroke="#A8202A" stroke-width="2" stroke-linejoin="round"/>

    <circle cx="30" cy="29" r="2.4" fill="#A8202A"/>

    <!-- Pernas -->
    <g stroke="#A8202A" stroke-width="2.6" stroke-linecap="round">
      <path d="M46 97v12M62 95v14"/>
      <path d="M40 109h12M56 109h12"/>
    </g>
  </g>
</svg>
