<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 128" role="img" aria-label="Nota manuscrita">
  <!-- Papel arrancado de um bloco: bordas irregulares nos quatro lados. -->
  <path d="M4 8 L40 3 L82 9 L128 2 L172 8 L214 4 L217 34 L212 62 L218 92 L213 122
           L170 126 L126 119 L84 125 L42 118 L6 124 L2 94 L7 64 L1 36 Z"
        fill="#FBF8F1"/>
  <path d="M4 8 L40 3 L82 9 L128 2 L172 8 L214 4 L217 34 L212 62 L218 92 L213 122
           L170 126 L126 119 L84 125 L42 118 L6 124 L2 94 L7 64 L1 36 Z"
        fill="none" stroke="#5A3A2A" stroke-width=".8" opacity=".16"/>

  <text x="110" y="42" font-family="'Courier Prime','Courier New',monospace" font-size="11"
        letter-spacing="1.2" text-anchor="middle" fill="#1B1B1B">Sofisticada, espirituosa,</text>
  <text x="110" y="60" font-family="'Courier Prime','Courier New',monospace" font-size="11"
        letter-spacing="1.2" text-anchor="middle" fill="#1B1B1B">deliberadamente</text>

  <!-- Palavra circulada a caneta: o gesto de quem edita o proprio texto. -->
  <text x="110" y="90" font-family="'Nothing You Could Do','Segoe Script',cursive" font-size="26"
        text-anchor="middle" fill="#A8202A">livre</text>
  <path d="M64 88 C64 74 86 68 110 68 C136 68 156 75 156 88 C156 100 134 106 110 106
           C88 106 68 100 66 90 C65 84 74 76 92 72"
        fill="none" stroke="#1B1B1B" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
</svg>
