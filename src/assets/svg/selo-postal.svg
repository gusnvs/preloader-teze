<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 156" role="img" aria-label="Selo postal Teze">
  <defs>
    <pattern id="sp-vichy" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F7F1E4"/>
      <rect width="5" height="10" fill="#A8202A" opacity=".58"/>
      <rect width="10" height="5" fill="#A8202A" opacity=".58"/>
    </pattern>

    <path id="sp-pata"
          d="M20 34 C20 26 26 20 35 20 C42 20 47 25 48 32 C49 39 46 44 43 48
             C41 53 41 57 44 60 C56 58 70 62 78 70 C87 79 84 92 70 96
