<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-label="Fita de tinta azul">
  <defs>
    <filter id="fa-edge" x="-8%" y="-25%" width="116%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.9" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- Pincelada opaca: as fitas azuis das referencias sao tinta, nao papel. -->
  <g filter="url(#fa-edge)">
    <rect x="6" y="8" width="188" height="24" fill="#2A4B6B"/>
    <rect x="6" y="8" width="188" height="8" fill="#3A5F82" opacity=".6"/>
    <rect x="6" y="26" width="188" height="6" fill="#1E3852" opacity=".5"/>
  </g>
</svg>
