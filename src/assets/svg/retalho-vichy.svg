<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Retalho de tecido xadrez">
  <defs>
    <pattern id="rv-vichy" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F7F1E4"/>
      <rect width="10" height="20" fill="#A8202A" opacity=".55"/>
      <rect width="20" height="10" fill="#A8202A" opacity=".55"/>
    </pattern>
    <!-- Recorte rasgado a mao: nenhum lado e reto. -->
    <clipPath id="rv-tear">
      <path d="M7 10 L26 4 L48 9 L70 3 L92 8 L112 5 L115 27 L110 48 L116 70 L112 92 L114 113
               L92 110 L70 116 L48 109 L27 115 L6 112 L3 90 L8 68 L2 47 L6 26 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rv-tear)">
    <rect width="120" height="120" fill="url(#rv-vichy)"/>
    <!-- Fios soltos na borda, tipicos de tecido rasgado. -->
    <rect width="120" height="120" fill="none" stroke="#F7F1E4" stroke-width="3" opacity=".5"/>
  </g>
</svg>
