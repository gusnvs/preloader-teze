<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 96" role="img" aria-label="Etiqueta de bagagem Teze">
  <defs>
    <pattern id="et-vichy" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#F7F1E4"/>
      <rect width="6" height="12" fill="#A8202A" opacity=".5"/>
      <rect width="12" height="6" fill="#A8202A" opacity=".5"/>
    </pattern>
  </defs>

  <!-- Cordao passando pelo ilhos. -->
  <path d="M6 34 C-4 26 2 12 14 12 C24 12 28 20 26 28" fill="none" stroke="#A8202A"
        stroke-width="2.4" stroke-linecap="round" opacity=".85"/>

  <!-- Corpo da etiqueta com o canto esquerdo chanfrado. -->
  <path d="M42 4 h100 a4 4 0 0 1 4 4 v80 a4 4 0 0 1 -4 4 h-100 l-16 -20 v-48 Z" fill="#F7F1E4"/>
  <path d="M42 4 h100 a4 4 0 0 1 4 4 v80 a4 4 0 0 1 -4 4 h-100 l-16 -20 v-48 Z" fill="none"
        stroke="#5A3A2A" stroke-width=".9" opacity=".22"/>

  <!-- Ilhos metalico. -->
  <circle cx="36" cy="48" r="7" fill="#EADFC9"/>
  <circle cx="36" cy="48" r="7" fill="none" stroke="#5A3A2A" stroke-width="1" opacity=".4"/>
  <circle cx="36" cy="48" r="3.4" fill="#FBF7EF"/>

  <rect x="52" y="10" width="88" height="8" fill="url(#et-vichy)" opacity=".85"/>
  <rect x="52" y="80" width="88" height="6" fill="url(#et-vichy)" opacity=".7"/>

  <text x="96" y="46" font-family="'Bodoni Moda',Didot,Georgia,serif" font-size="26"
        font-style="italic" text-anchor="middle" fill="#A8202A">Tezê</text>
  <text x="96" y="64" font-family="'Courier Prime','Courier New',monospace" font-size="6.6"
        letter-spacing="3" text-anchor="middle" fill="#1B1B1B" opacity=".65">BAGAGEM DE MAO</text>
</svg>
