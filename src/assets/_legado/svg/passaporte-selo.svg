<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" role="img" aria-label="Carimbo de passaporte">
  <defs>
    <filter id="ps-ink" x="-12%" y="-20%" width="124%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="ps-arc-top" d="M80 52 m-62 0 a62 34 0 0 1 124 0" fill="none"/>
    <path id="ps-arc-bottom" d="M80 52 m62 0 a62 34 0 0 1 -124 0" fill="none"/>
  </defs>

  <g filter="url(#ps-ink)" opacity=".72">
    <ellipse cx="80" cy="48" rx="72" ry="42" fill="none" stroke="#1B1B1B" stroke-width="2.2"/>
    <ellipse cx="80" cy="48" rx="63" ry="34" fill="none" stroke="#1B1B1B" stroke-width="1"/>

    <text font-family="'Courier Prime','Courier New',monospace" font-size="10"
          letter-spacing="4" fill="#1B1B1B">
      <textPath href="#ps-arc-top" startOffset="50%" text-anchor="middle">GRU — PARIS</textPath>
    </text>
    <text font-family="'Courier Prime','Courier New',monospace" font-size="9"
          letter-spacing="4" fill="#1B1B1B">
      <textPath href="#ps-arc-bottom" startOffset="50%" text-anchor="middle">FRANCE</textPath>
    </text>

    <text x="80" y="44" font-family="'Courier Prime','Courier New',monospace" font-size="15"
          font-weight="700" letter-spacing="2" text-anchor="middle" fill="#1B1B1B">Dp14</text>
    <text x="80" y="60" font-family="'Courier Prime','Courier New',monospace" font-size="11"
          letter-spacing="3" text-anchor="middle" fill="#1B1B1B">1990</text>
    <text x="80" y="72" font-family="'Courier Prime','Courier New',monospace" font-size="6"
          letter-spacing="1.6" text-anchor="middle" fill="#1B1B1B" opacity=".8">AP / 12789</text>
  </g>
</svg>
