<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Carimbo postal Paris">
  <defs>
    <!-- Falhas de tinta: o carimbo nunca imprime uniforme. -->
    <filter id="cp-ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="cp-top" d="M60 60 m-44 0 a44 44 0 0 1 88 0" fill="none"/>
    <path id="cp-bottom" d="M60 60 m44 0 a44 44 0 0 1 -88 0" fill="none"/>
  </defs>

  <g filter="url(#cp-ink)" opacity=".82">
    <circle cx="60" cy="60" r="47" fill="none" stroke="#2A4B6B" stroke-width="2.4"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="#2A4B6B" stroke-width="1.2"/>

    <text font-family="'Courier Prime','Courier New',monospace" font-size="9.5"
          letter-spacing="2.6" fill="#2A4B6B">
      <textPath href="#cp-top" startOffset="50%" text-anchor="middle">TEZÊ · VOO ÚNICO</textPath>
    </text>
    <text font-family="'Courier Prime','Courier New',monospace" font-size="9.5"
          letter-spacing="2.6" fill="#2A4B6B">
      <textPath href="#cp-bottom" startOffset="50%" text-anchor="middle">PARIS · FRANCE</textPath>
    </text>

    <text x="60" y="55" font-family="'Courier Prime','Courier New',monospace" font-size="15"
          font-weight="700" letter-spacing="1" text-anchor="middle" fill="#2A4B6B">Dp14</text>
    <text x="60" y="72" font-family="'Courier Prime','Courier New',monospace" font-size="13"
          letter-spacing="2" text-anchor="middle" fill="#2A4B6B">1990</text>

    <g stroke="#2A4B6B" stroke-width="1.6" stroke-linecap="round">
      <path d="M22 84h18M80 84h18"/>
    </g>
  </g>
</svg>
