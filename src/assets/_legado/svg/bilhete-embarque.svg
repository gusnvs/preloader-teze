<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 116" role="img" aria-label="Cartao de embarque">
  <defs>
    <clipPath id="be-clip"><rect x="0" y="0" width="300" height="116" rx="3"/></clipPath>
  </defs>

  <g clip-path="url(#be-clip)">
    <rect width="300" height="116" fill="#F7F1E4"/>
    <rect width="300" height="10" fill="#A8202A" opacity=".85"/>

    <!-- Picote vertical separando o canhoto. -->
    <path d="M214 0v116" stroke="#1B1B1B" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>
    <circle cx="214" cy="0" r="6" fill="#FBF7EF"/>
    <circle cx="214" cy="116" r="6" fill="#FBF7EF"/>

    <g font-family="'Courier Prime','Courier New',monospace" fill="#1B1B1B">
      <text x="16" y="30" font-size="7" letter-spacing="2.4" opacity=".6">BOARDING PASS</text>

      <text x="16" y="48" font-size="6.5" letter-spacing="1.8" opacity=".55">DE</text>
      <text x="16" y="64" font-size="17" letter-spacing="1">ZAZÊ</text>

      <text x="112" y="48" font-size="6.5" letter-spacing="1.8" opacity=".55">PARA</text>
      <text x="112" y="64" font-size="17" letter-spacing="1">TEZÊ</text>

      <text x="16" y="86" font-size="6.5" letter-spacing="1.8" opacity=".55">VOO</text>
      <text x="16" y="100" font-size="10">FRA184</text>

      <text x="80" y="86" font-size="6.5" letter-spacing="1.8" opacity=".55">PORTAO</text>
      <text x="80" y="100" font-size="10">21</text>

      <text x="140" y="86" font-size="6.5" letter-spacing="1.8" opacity=".55">ASSENTO</text>
      <text x="140" y="100" font-size="10">01A</text>

      <text x="230" y="34" font-size="6.5" letter-spacing="1.8" opacity=".55">EMBARQUE</text>
      <text x="230" y="50" font-size="12">SÓ PARA</text>
      <text x="230" y="64" font-size="12">ORIGINAIS</text>
    </g>

    <!-- Codigo de barras: larguras irregulares, como impressao real. -->
    <g fill="#1B1B1B" opacity=".9">
      <rect x="230" y="78" width="2.5" height="26"/><rect x="235" y="78" width="1" height="26"/>
      <rect x="238" y="78" width="3" height="26"/><rect x="243" y="78" width="1" height="26"/>
      <rect x="246" y="78" width="1.5" height="26"/><rect x="250" y="78" width="3" height="26"/>
      <rect x="255" y="78" width="1" height="26"/><rect x="258" y="78" width="2" height="26"/>
      <rect x="262" y="78" width="1" height="26"/><rect x="265" y="78" width="3.5" height="26"/>
      <rect x="271" y="78" width="1" height="26"/><rect x="274" y="78" width="2" height="26"/>
      <rect x="278" y="78" width="1" height="26"/><rect x="281" y="78" width="3" height="26"/>
    </g>

    <path d="M0 115.5h300" stroke="#5A3A2A" stroke-width="1" opacity=".14"/>
  </g>
