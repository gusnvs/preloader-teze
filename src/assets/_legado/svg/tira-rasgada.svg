       limpo, a de baixo e o rasgo com fibras. -->
  <path d="M2 6 L258 2 L256 40 C240 44 226 38 210 42 C194 46 180 40 164 44
           C148 48 134 42 118 46 C102 50 88 44 72 48 C56 52 42 46 26 50
           C18 52 10 50 4 52 Z"
        fill="#E7DAC0"/>
