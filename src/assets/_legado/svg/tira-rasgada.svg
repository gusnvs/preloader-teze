  <path d="M256 40 C240 44 226 38 210 42 C194 46 180 40 164 44
           C148 48 134 42 118 46 C102 50 88 44 72 48 C56 52 42 46 26 50
           C18 52 10 50 4 52"
        fill="none" stroke="#F6F0E2" stroke-width="2.6" opacity=".95"/>

  <text x="130" y="30" font-family="'Courier Prime','Courier New',monospace" font-size="11"
        letter-spacing="5.4" text-anchor="middle" fill="#1B1B1B" opacity=".72">
    ORIGINAL · INSUBSTITUÍVEL
  </text>
</svg>
